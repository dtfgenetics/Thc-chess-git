<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kush Kings Chess</title>
    <meta
      name="description"
      content="Kush Kings Chess multiplayer room for the DTF Seeds games hub."
    />
    <link rel="stylesheet" href="./assets/app.css" />
  </head>
  <body data-game-status="setup">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Kush Kings Chess home">
          <span class="brand-mark">KK</span>
          <span>
            <strong>Kush Kings Chess</strong>
            <small>DTF Seeds game room</small>
          </span>
        </a>
        <div class="room-pill" id="room-pill">No room loaded</div>
      </header>

      <main class="game-layout">
        <section class="board-zone" aria-label="Chess board">
          <div class="player-strip" id="top-player">Dark side open</div>
          <div class="board-wrap">
            <div class="board" id="board" aria-label="Kush Kings Chess board"></div>
          </div>
          <div class="player-strip" id="bottom-player">Light side open</div>
        </section>

        <aside class="control-zone" aria-label="Game controls">
          <section class="panel" id="setup-panel">
            <h1>Kush Kings Chess</h1>
            <form class="stack" id="player-form">
              <label>
                Display name
                <input
                  id="player-name"
                  name="playerName"
                  maxlength="24"
                  autocomplete="nickname"
                  placeholder="Grower"
                />
              </label>
              <label>
                Starting side
                <select id="starting-side" name="startingSide">
                  <option value="random">Random</option>
                  <option value="white">Light side</option>
                  <option value="black">Dark side</option>
                </select>
              </label>
              <div class="button-row">
                <button type="button" class="primary" id="create-room">Start Match</button>
                <button type="button" id="new-token">New Local Player</button>
              </div>
            </form>
            <form class="stack join-row" id="join-form">
              <label>
                Room code
                <input
                  id="join-code"
                  name="joinCode"
                  maxlength="12"
                  autocomplete="off"
                  placeholder="ABC123"
                />
              </label>
              <button type="submit">Join Session</button>
            </form>
          </section>

          <section class="panel" id="status-panel">
            <div class="status-line">
              <span id="game-status">Ready</span>
              <div class="status-actions">
                <button type="button" id="copy-invite" disabled>Copy Invite</button>
                <button type="button" id="resign-match" class="danger-action" disabled>Resign</button>
              </div>
            </div>
            <div class="invite-url" id="invite-url">Create or join a room to get an invite.</div>
            <div class="turn-box" id="turn-box">Waiting for a room.</div>
            <button type="button" id="cancel-waiting-room" class="danger-action" hidden>Cancel Waiting Room</button>
            <button type="button" id="rematch-room" hidden>Create Rematch Room</button>
          </section>

          <section class="panel chat-panel" id="chat-panel">
            <h2>Room Chat</h2>
            <ol class="chat-log" id="chat-log"></ol>
            <form class="chat-form" id="chat-form">
              <input
                id="chat-input"
                maxlength="240"
                autocomplete="off"
                placeholder="Grow room chat..."
              />
              <button type="submit">Send</button>
            </form>
          </section>

          <section class="panel move-panel">
            <h2>Moves</h2>
            <ol class="move-list" id="move-list"></ol>
          </section>
        </aside>
      </main>
    </div>

    <dialog class="promotion-dialog" id="promotion-dialog" aria-labelledby="promotion-title">
      <div class="promotion-card">
        <h2 id="promotion-title">Choose promotion</h2>
        <p>Pick the piece for your pawn.</p>
        <div class="promotion-options" id="promotion-options">
          <button type="button" data-promotion="q">Queen</button>
          <button type="button" data-promotion="r">Rook</button>
          <button type="button" data-promotion="b">Bishop</button>
          <button type="button" data-promotion="n">Knight</button>
        </div>
        <button type="button" class="promotion-cancel" id="promotion-cancel">Cancel</button>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./assets/poll-auth.js"></script>
    <script type="module" src="./assets/app.js"></script>
    <script type="module" src="./assets/rematch.js"></script>
    <script type="module" src="./assets/waiting-room.js"></script>
  </body>
</html>
