name: Deploy Kush Kings production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact commit SHA from main to deploy; leave blank for current main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kush-kings-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.KUSH_VPS_HOST }}
      SSH_USER: ${{ secrets.KUSH_VPS_USER }}
      SSH_PORT: ${{ secrets.KUSH_VPS_PORT }}
      SSH_KEY: ${{ secrets.KUSH_VPS_SSH_KEY }}
      PG_PASSWORD: ${{ secrets.KUSH_PG_PASSWORD }}
      SESSION_SECRET: ${{ secrets.KUSH_SESSION_SECRET }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release SHA
        id: release
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.release_sha }}'
          if [[ -n "$requested" ]]; then
            if [[ ! "$requested" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "release_sha must be a full 40-character commit SHA" >&2
              exit 1
            fi
            git fetch origin "$requested"
            sha="$(git rev-parse "$requested^{commit}")"
            git merge-base --is-ancestor "$sha" origin/main || {
              echo "Requested release is not contained in main" >&2
              exit 1
            }
          else
            sha="$(git rev-parse HEAD)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying exact release $sha"

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SSH_HOST SSH_USER SSH_KEY PG_PASSWORD SESSION_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production secret for $name" >&2
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]] || exit 1
          if [[ ${#SESSION_SECRET} -lt 32 ]]; then
            echo "KUSH_SESSION_SECRET must be at least 32 characters" >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_kush_kings"
          chmod 600 "$HOME/.ssh/id_kush_kings"
          ssh-keyscan -p "$port" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Build production environment file
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > /tmp/kush-kings.env.production <<EOF
          APP_NAME="Kush Kings Chess"
          NODE_ENV="production"
          NEXT_PUBLIC_APP_NAME="Kush Kings Chess"
          NEXT_PUBLIC_SITE_URL="https://chess.dtfseeds.com"
          NEXT_PUBLIC_API_URL="https://chess-api.dtfseeds.com"
          PORT="3001"
          CORS_ORIGIN="https://chess.dtfseeds.com,https://dtfseeds.com,https://www.dtfseeds.com"
          SESSION_COOKIE_NAME="kush_kings_chess"
          SESSION_COOKIE_DOMAIN=".dtfseeds.com"
          SESSION_SECRET="$SESSION_SECRET"
          PGHOST="db"
          PGPORT="5432"
          PGUSER="kush_kings"
          PGPASSWORD="$PG_PASSWORD"
          PGDATABASE="kush_kings_chess"
          EOF

      - name: Upload production environment
        shell: bash
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          scp -P "$port" -i "$HOME/.ssh/id_kush_kings" \
            /tmp/kush-kings.env.production \
            "$SSH_USER@$SSH_HOST:/tmp/kush-kings.env.production"

      - name: Deploy exact release on VPS
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          ssh -p "$port" -i "$HOME/.ssh/id_kush_kings" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$RELEASE_SHA'" <<'REMOTE'
          set -euo pipefail
          release_sha="$1"
          deploy_dir="$HOME/apps/kush-kings-chess"

          for cmd in git curl; do
            command -v "$cmd" >/dev/null 2>&1 || {
              echo "Required command is missing on the VPS: $cmd" >&2
              exit 1
            }
          done

          if docker info >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker info >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "Docker is not installed or the deploy user cannot access it" >&2
            exit 1
          fi
          "${DOCKER[@]}" compose version >/dev/null

          mkdir -p "$HOME/apps"
          if [[ ! -d "$deploy_dir/.git" ]]; then
            git clone https://github.com/dtfgenetics/Thc-chess-git.git "$deploy_dir"
          fi

          cd "$deploy_dir"
          git fetch --prune origin main
          git cat-file -e "$release_sha^{commit}"
          git checkout --detach "$release_sha"
          git reset --hard "$release_sha"

          mv /tmp/kush-kings.env.production .env.production
          chmod 600 .env.production

          compose=("${DOCKER[@]}" compose --env-file .env.production -f docker-compose.production.yml -f deploy/caddy/docker-compose.caddy.yml)
          "${compose[@]}" build --pull
          "${compose[@]}" up -d --remove-orphans
          "${compose[@]}" ps

          for attempt in $(seq 1 24); do
            if curl --fail --silent http://127.0.0.1:3001/health | grep -q '"status":"ok"' && \
               curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              echo "Local client and API health checks passed"
              exit 0
            fi
            sleep 5
          done

          "${compose[@]}" logs --tail=200
          echo "Local production health checks did not become ready" >&2
          exit 1
          REMOTE

      - name: Verify public HTTPS endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            https://chess-api.dtfseeds.com/health | grep -q '"status":"ok"'
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            https://chess.dtfseeds.com/ >/dev/null
          echo "Kush Kings production endpoints are healthy"

      - name: Remove local secret material
        if: always()
        shell: bash
        run: |
          rm -f /tmp/kush-kings.env.production "$HOME/.ssh/id_kush_kings"
