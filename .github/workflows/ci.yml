name: Kush Kings Chess CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
      - "reconcile/**"

permissions:
  contents: read

jobs:
  client-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebrand check
        run: pnpm check:rebrand

      - name: Lint client
        run: pnpm --filter client lint

      - name: Build client
        run: pnpm build:client

      - name: Validate public runtime contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const contract = JSON.parse(fs.readFileSync('deploy/runtime-contract.json', 'utf8'));
          if (contract.frontend !== 'https://chess.dtfseeds.com') throw new Error('Unexpected frontend target');
          if (contract.api !== 'https://chess-api.dtfseeds.com') throw new Error('Unexpected API target');
          if (!contract.requiresPostgres || !contract.requiresPersistentSessions) throw new Error('Database/session requirement cannot be removed');
          if (!contract.requiresWebSocketUpgrade) throw new Error('WebSocket upgrade requirement cannot be removed');
          if (contract.staticOnlyDeploymentSupported !== false) throw new Error('Kush Kings cannot become a static-only deployment');
          NODE

  server-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kush_kings_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kush_kings_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm build:server

      - name: Verify player seat ownership
        run: node server/scripts/verify-player-seat.mjs

      - name: Verify observer roster ownership
        run: node server/scripts/verify-observer-roster.mjs

      - name: Verify resignation ownership
        run: node server/scripts/verify-resignation.mjs

      - name: Verify draw offer ownership
        run: node server/scripts/verify-draw-offers.mjs

      - name: Verify abandonment claim eligibility
        run: node server/scripts/verify-abandonment-claim.mjs

      - name: Verify chat validation and rate limiting
        run: node server/scripts/verify-chat-guard.mjs

      - name: Verify room selection and explicit leave routing
        run: node server/scripts/verify-room-selection.mjs

      - name: Verify game database row mapping
        run: node server/scripts/verify-game-row-mapping.mjs

      - name: Verify authentication input boundaries
        run: node server/scripts/verify-auth-input.mjs

      - name: Verify match creation input and room allocation
        run: node server/scripts/verify-game-creation.mjs

      - name: Verify archive query input boundaries
        run: node server/scripts/verify-query-input.mjs

      - name: Verify room code input boundaries
        run: node server/scripts/verify-room-code.mjs

      - name: Verify grower profile lookup contract
        run: node server/scripts/verify-profile-contract.mjs

      - name: Verify result inputs and atomic persistence contract
        run: node server/scripts/verify-result-persistence.mjs

      - name: Verify production API, PostgreSQL session, and Socket.IO contract
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: kush_kings_test
        run: pnpm test:production-runtime

  deployment-config-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose merge
        env:
          NEXT_PUBLIC_APP_NAME: Kush Kings Chess
          NEXT_PUBLIC_SITE_URL: https://chess.dtfseeds.com
          NEXT_PUBLIC_API_URL: https://chess-api.dtfseeds.com
          PGDATABASE: kush_kings_chess
          PGUSER: kush_kings
          PGPASSWORD: ci-placeholder-only
        run: |
          cp .env.production.example .env.production
          docker compose \
            -f docker-compose.production.yml \
            -f deploy/caddy/docker-compose.caddy.yml \
            config >/dev/null
          rm -f .env.production

      - name: Validate Caddy production config
        run: |
          docker run --rm \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Verify deployment contract markers
        run: |
          grep -q 'workflow_dispatch' .github/workflows/deploy-production.yml
          grep -q 'KUSH_VPS_SSH_KEY' .github/workflows/deploy-production.yml
          grep -q 'https://chess-api.dtfseeds.com/health' .github/workflows/deploy-production.yml
          grep -q 'reverse_proxy client:3000' deploy/caddy/Caddyfile
          grep -q 'reverse_proxy server:3001' deploy/caddy/Caddyfile

  hostinger-shared-hosting-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP fallback syntax
        run: |
          find public-hostinger/kush-kings-chess -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate fallback browser helpers
        run: |
          node --check public-hostinger/kush-kings-chess/js/fallback-polish.js
          node --check public-hostinger/kush-kings-chess/js/dtf-sitewide-header-v5.js

      - name: Verify fallback game assets are wired
        run: |
          grep -q 'js/fallback-polish.js' public-hostinger/kush-kings-chess/play.php
          grep -q 'input\[name="from_sq"\]' public-hostinger/kush-kings-chess/js/fallback-polish.js
          grep -q 'Copy Invite' public-hostinger/kush-kings-chess/js/fallback-polish.js
          grep -q 'prefers-reduced-motion' public-hostinger/kush-kings-chess/css/style.css

      - name: Verify DTFSeeds V5 header on both shared-hosting entry points
        run: |
          set -euo pipefail
          css='public-hostinger/kush-kings-chess/css/dtf-sitewide-header-v5.css'
          js='public-hostinger/kush-kings-chess/js/dtf-sitewide-header-v5.js'
          test -s "$css"
          test -s "$js"
          grep -Fq '@media(max-width:1120px)' "$css"
          grep -Fq '@media(max-width:700px)' "$css"
          grep -Fq 'aria-expanded' "$js"
          for page in public-hostinger/kush-kings-chess/index.html public-hostinger/kush-kings-chess/play.php; do
            grep -Fq 'data-dtf-shell="header-v5"' "$page"
            grep -Fq 'data-dtf-sitewide-header="approved-reference-v1"' "$page"
            grep -Fq 'css/dtf-sitewide-header-v5.css' "$page"
            grep -Fq 'js/dtf-sitewide-header-v5.js' "$page"
            grep -Fq 'href="/seeds/">Seeds</a>' "$page"
            grep -Fq 'href="/learn/">Learn</a>' "$page"
            grep -Fq 'href="/courses/">Courses</a>' "$page"
            grep -Fq '>Diagnostic</a>' "$page"
            grep -Fq 'href="/games/"' "$page"
            grep -Fq 'href="/community/">Community</a>' "$page"
            grep -Fq 'href="/shop/">Shop</a>' "$page"
          done
