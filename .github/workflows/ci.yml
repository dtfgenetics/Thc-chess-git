name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"

jobs:
  client-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebrand check
        run: pnpm check:rebrand

      - name: Lint client
        run: pnpm --filter client lint

      - name: Build client
        run: pnpm build:client

  server-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm build:server

      - name: Verify player seat ownership
        run: node server/scripts/verify-player-seat.mjs

      - name: Verify observer roster ownership
        run: node server/scripts/verify-observer-roster.mjs

      - name: Verify resignation ownership
        run: node server/scripts/verify-resignation.mjs

      - name: Verify draw offer ownership
        run: node server/scripts/verify-draw-offers.mjs

      - name: Verify abandonment claim eligibility
        run: node server/scripts/verify-abandonment-claim.mjs

      - name: Verify chat validation and rate limiting
        run: node server/scripts/verify-chat-guard.mjs

      - name: Verify room selection and explicit leave routing
        run: node server/scripts/verify-room-selection.mjs

  deployment-config-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose merge
        env:
          NEXT_PUBLIC_APP_NAME: Kush Kings Chess
          NEXT_PUBLIC_SITE_URL: https://chess.dtfseeds.com
          NEXT_PUBLIC_API_URL: https://chess-api.dtfseeds.com
          PGDATABASE: kush_kings_chess
          PGUSER: kush_kings
          PGPASSWORD: ci-placeholder-only
        run: |
          cp .env.production.example .env.production
          docker compose \
            -f docker-compose.production.yml \
            -f deploy/caddy/docker-compose.caddy.yml \
            config >/dev/null
          rm -f .env.production

      - name: Validate Caddy production config
        run: |
          docker run --rm \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Verify deployment contract markers
        run: |
          grep -q 'workflow_dispatch' .github/workflows/deploy-production.yml
          grep -q 'KUSH_VPS_SSH_KEY' .github/workflows/deploy-production.yml
          grep -q 'https://chess-api.dtfseeds.com/health' .github/workflows/deploy-production.yml
          grep -q 'reverse_proxy client:3000' deploy/caddy/Caddyfile
          grep -q 'reverse_proxy server:3001' deploy/caddy/Caddyfile

  hostinger-shared-hosting-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP fallback syntax
        run: |
          find public-hostinger/kush-kings-chess -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate fallback browser helper
        run: node --check public-hostinger/kush-kings-chess/js/fallback-polish.js

      - name: Verify fallback assets are wired
        run: |
          grep -q 'js/fallback-polish.js' public-hostinger/kush-kings-chess/play.php
          grep -q 'input\[name="from_sq"\]' public-hostinger/kush-kings-chess/js/fallback-polish.js
          grep -q 'Copy Invite' public-hostinger/kush-kings-chess/js/fallback-polish.js
          grep -q 'prefers-reduced-motion' public-hostinger/kush-kings-chess/css/style.css
