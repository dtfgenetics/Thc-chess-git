name: Apply and verify 3D chess integration

on:
  push:
    branches:
      - feature/3d-kush-kings

permissions:
  contents: write

jobs:
  integrate-3d-board:
    if: ${{ !contains(github.event.head_commit.message, '[skip 3d verify]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/3d-kush-kings

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Integrate live 3D board
        run: python scripts/apply-3d-gamepage.py

      - name: Lint client
        run: pnpm --filter client lint

      - name: Build client
        run: pnpm build:client

      - name: Commit integrated board when changed
        run: |
          if git diff --quiet client/src/components/game/GamePage.tsx; then
            echo "GamePage integration is already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/game/GamePage.tsx
          git commit -m "Wire 3D Kush Kings board into live rooms [skip 3d verify]"
          git push
