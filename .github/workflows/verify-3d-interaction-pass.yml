name: Verify 3D interaction pass

on:
  push:
    branches:
      - feature/3d-kush-kings

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip interaction verify]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/3d-kush-kings

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply promotion picker wiring
        run: python scripts/apply-promotion-picker.py

      - name: Apply 3D camera controls
        run: python scripts/apply-3d-camera-controls.py

      - name: Apply 3D animation and mobile sizing
        run: python scripts/apply-3d-animation-mobile.py

      - name: Apply captured trays and WebGL fallback
        run: python scripts/apply-captured-fallback.py

      - name: Apply lobby connection resilience
        run: python scripts/apply-lobby-resilience.py

      - name: Check rebrand
        run: pnpm check:rebrand

      - name: Lint client
        run: pnpm --filter client lint

      - name: Build client
        run: pnpm build:client

      - name: Build server
        run: pnpm build:server

      - name: Commit verified interaction pass
        run: |
          if git diff --quiet client/src/components/game/GamePage.tsx client/src/components/game/ThreeChessBoard.tsx client/src/components/game/socketEvents.ts; then
            echo "Interaction pass is already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/game/GamePage.tsx client/src/components/game/ThreeChessBoard.tsx client/src/components/game/socketEvents.ts
          git commit -m "Improve multiplayer lobby connection resilience [skip interaction verify]"
          git push
