name: Verify 3D interaction pass

on:
  push:
    branches:
      - feature/3d-kush-kings

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip interaction verify]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/3d-kush-kings

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply draw offer flow
        run: python scripts/apply-draw-offers.py

      - name: Check rebrand
        run: pnpm check:rebrand

      - name: Lint client
        run: pnpm --filter client lint

      - name: Lint server source
        run: pnpm --dir server exec eslint src --ext .ts

      - name: Build client
        run: pnpm build:client

      - name: Build server
        run: pnpm build:server

      - name: Verify resignation ownership
        run: node server/scripts/verify-resignation.mjs

      - name: Verify draw offer ownership
        run: node server/scripts/verify-draw-offers.mjs

      - name: Commit verified draw offer flow
        run: |
          if git diff --quiet client/src/components/game/GamePage.tsx client/src/components/game/socketEvents.ts server/src/socket/game.socket.ts server/src/socket/index.ts types/index.d.ts; then
            echo "Draw offer flow is already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/game/GamePage.tsx client/src/components/game/socketEvents.ts server/src/socket/game.socket.ts server/src/socket/index.ts types/index.d.ts
          git commit -m "Add server-authoritative draw offers [skip interaction verify]"
          git push
