name: Verify 3D interaction pass

on:
  push:
    branches:
      - feature/3d-kush-kings

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip interaction verify]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/3d-kush-kings

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply final draw guards
        run: python scripts/apply-draw-guards.py

      - name: Check rebrand
        run: pnpm check:rebrand

      - name: Lint client
        run: pnpm --filter client lint

      - name: Lint server source
        run: pnpm --dir server exec eslint src --ext .ts

      - name: Build client
        run: pnpm build:client

      - name: Build server
        run: pnpm build:server

      - name: Verify resignation ownership
        run: node server/scripts/verify-resignation.mjs

      - name: Verify draw offer ownership
        run: node server/scripts/verify-draw-offers.mjs

      - name: Verify completion UX markers
        run: |
          grep -q 'Play Again / New Match' client/src/components/game/GamePage.tsx
          grep -q 'Play Again / New Match' client/src/components/archive/ArchivedGame.tsx
          grep -q 'Offer Draw' client/src/components/game/GamePage.tsx
          grep -q 'Resign' client/src/components/game/GamePage.tsx

      - name: Commit final multiplayer guards
        run: |
          if git diff --quiet server/src/socket/game.socket.ts; then
            echo "Final multiplayer guards are already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/socket/game.socket.ts
          git commit -m "Harden multiplayer draw offer guards [skip interaction verify]"
          git push
